services:
  bhf-web:
    environment:
      BHF_TEST_MODE: "true"
      BHF_STUDY_DB_PATH: /tmp/bhf-test/study.sqlite
      BHF_WEB_CONFIG_PATH: /tmp/bhf-test/web-config.json
      BHF_MEMORY_ENABLED: "false"
      BHF_MEMORY_PATH: /tmp/bhf-test/memory
      BHF_CESIUM_ION_TOKEN: ""
    tmpfs:
      - /tmp/bhf-test

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q 'ready'"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s

  gui-tests:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      sh -lc "pip install --no-cache-dir -r /workspace/requirements-gui.txt
      && pytest /workspace/tests/gui -m 'not slow'"
    environment:
      BHF_GUI_BASE_URL: http://bhf-web:8080
      BHF_WEBDRIVER_URL: http://selenium-chrome:4444/wd/hub
      BHF_GUI_ARTIFACTS_DIR: /artifacts
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/workspace
      - ./tests/gui/artifacts:/artifacts
    depends_on:
      bhf-web:
        condition: service_healthy
      selenium-chrome:
        condition: service_healthy
