name: Commentary v1.2 legacy source verification

on:
  workflow_dispatch:

jobs:
  legacy-source-release:
    name: Immutable v1.2 source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze commit: run the source-only verifier against immutable inputs.
          ref: f02122eed9642f173e2be3ad39ac5b979a23b898
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install source verification dependencies
        run: pip install -r tools/requirements.txt

      - name: Verify immutable v1.2 source release
        run: python tools/commentary_v12_freeze.py verify

      - name: Verify frozen source release failure cases
        run: pytest -q tests/test_commentary_v12_freeze.py
