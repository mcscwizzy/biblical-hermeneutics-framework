services:
  bhf-https-proxy:
    image: nginx:1.27-alpine
    depends_on:
      bhf-web:
        condition: service_healthy
    ports:
      - "${BHF_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/local-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.bhf/certs:/etc/nginx/certs:ro
    restart: unless-stopped
