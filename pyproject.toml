[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biblical-hermeneutics-framework"
dynamic = ["version"]
description = "Biblical Hermeneutics Framework core agent and Canonical Knowledge Library"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["bible", "hermeneutics", "canonical-library", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Religion",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Religion",
]
dependencies = [
  "fastapi>=0.115,<0.116",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]
gui = [
  "requests>=2.31",
  "selenium>=4.20,<5",
  "webdriver-manager>=4.0",
]

[project.scripts]
ckl-version = "framework.canonical_library.__main__:main"
ckl = "framework.canonical_library.__main__:main"

[tool.vercel]
entrypoint = "bhf_web.app:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.packages.find]
include = ["bhf_agent*", "bhf_web*", "framework.canonical_library*", "framework.lexical*", "framework.commentary*"]
namespaces = true

[tool.setuptools.package-data]
"framework.canonical_library" = ["manifest.json", "objects/**/*.json", "schema/*.json", "benchmarks/*.json", "data/*.sqlite"]
"framework.lexical" = ["schema/*.json", "database/*.sqlite"]
"bhf_agent" = ["data/*.json"]
"bhf_web" = ["templates/*.html", "static/**/*"]
