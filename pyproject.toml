[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biblical-hermeneutics-framework"
dynamic = ["version"]
description = "Biblical Hermeneutics Framework core agent and Canonical Knowledge Library"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["bible", "hermeneutics", "canonical-library", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Religion",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Religion",
]

[project.scripts]
ckl-version = "framework.canonical_library.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.packages.find]
include = ["bhf_agent*", "framework.canonical_library*"]
namespaces = true

[tool.setuptools.package-data]
"framework.canonical_library" = ["manifest.json", "objects/**/*.json", "schema/*.json"]
"bhf_agent" = ["data/*.json"]
