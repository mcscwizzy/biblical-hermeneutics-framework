services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: "${BHF_CONTEXT_WINDOW:-12288}"
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/scripts/ollama-init.sh"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
    volumes:
      - ollama:/root/.ollama
      - ./scripts/ollama-init.sh:/scripts/ollama-init.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  bhf-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BHF_HEBREW_LEXICON_REVISION: "${BHF_HEBREW_LEXICON_REVISION:-21c9add13bc727d3a951361778e97e3ff7afd1ce}"
        BHF_STRONGS_REVISION: "${BHF_STRONGS_REVISION:-0acd2f251c2d35ff8db2dece4e0593979d3ac223}"
        BHF_OSHB_REVISION: "${BHF_OSHB_REVISION:-3d15126fb1ef74867fc1434be1942e837932691f}"
        BHF_MORPHGNT_REVISION: "${BHF_MORPHGNT_REVISION:-aaed91e57c8e4a8dc9a2383e129ca5e75fe6393d}"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    ports:
      - "${BHF_HTTP_PORT:-8080}:8080"
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      BHF_BASE_URL: "${BHF_BASE_URL:-}"
      BHF_MODEL: "${BHF_MODEL:-}"
      BHF_PROFILE: "${BHF_PROFILE:-standard}"
      BHF_ANSWER_MODE: "${BHF_ANSWER_MODE:-study}"
      BHF_TEMPERATURE: "${BHF_TEMPERATURE:-0.3}"
      BHF_MAX_TOKENS: "${BHF_MAX_TOKENS:-8192}"
      BHF_CONTEXT_WINDOW: "${BHF_CONTEXT_WINDOW:-12288}"
      BHF_SHOW_METHOD_NOTES: "${BHF_SHOW_METHOD_NOTES:-true}"
      BHF_MEMORY_ENABLED: "${BHF_MEMORY_ENABLED:-false}"
      BHF_MEMORY_PATH: /app/.bhf-data/sessions
      BHF_LEXICAL_DATABASE_PATH: /app/.bhf-data/lexicon.sqlite
      BHF_LEXICAL_SEED_POLICY: "${BHF_LEXICAL_SEED_POLICY:-refresh}"
      BHF_STUDY_DB_PATH: /app/.bhf-data/study.sqlite
      BHF_WEB_CONFIG_PATH: /app/.bhf-data/web-config.json
    volumes:
      - ./.bhf:/app/.bhf-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama:
