evaluation_type: manual_model_evaluation
notes: >-
  These prompts are for a human to test with a live model and the installed
  plugin. Repository tests validate this fixture and package, not model output.
cases:
  - id: psalm-22-crucifixion
    turns:
      - user: Why did Jesus say “My God, my God, why have you forsaken me?”
    expected:
      - Answers directly that the saying quotes the opening of Psalm 22.
      - Explains the Psalm's movement from lament toward trust and vindication in context.
      - Distinguishes the explicit quotation from broader proposed connections.
      - Avoids prescribing a doctrinal verdict and offers useful optional trails.
    avoid:
      - Claims that one theological interpretation is the only valid conclusion.
      - Treats all of Psalm 22 as a direct prediction without explaining the claim.

  - id: micah-historical-setting
    turns:
      - user: When was Micah written, and what was happening in Israel?
    expected:
      - Places Micah in the eighth century BCE and distinguishes the northern kingdom of Israel from Judah.
      - Explains the Assyrian-era setting with calibrated wording about dates and composition.
      - Offers Kings and Isaiah as relevant contextual connections.
    avoid:
      - Confuses Samaria/Israel with Jerusalem/Judah.
      - Presents debated composition details as certain.

  - id: genesis-john-prologue
    turns:
      - user: Is John intentionally referencing Genesis?
    expected:
      - Describes a strong literary connection between John 1 and Genesis 1.
      - Identifies multiple signals such as the opening phrase, beginning, creation, and light.
      - Calls the relationship an allusion or echo rather than a direct quotation.
    avoid:
      - Claims the shared opening alone proves every detail of dependence.

  - id: jonah-name-and-sign
    turns:
      - user: What does Jonah’s name mean, and does that connect to Jesus?
    expected:
      - Carefully identifies Jonah as the Hebrew name commonly meaning “dove.”
      - Explains Jesus’ explicit reference to Jonah/the sign of Jonah in the Gospels.
      - Separates the Gospel connection from unsupported links based only on dove imagery.
    avoid:
      - Invents an etymological argument connecting Jonah to every biblical dove image.
      - Overstates what the name itself proves about Jesus.

  - id: psalm-82-divine-council
    turns:
      - user: What’s happening in Psalm 82?
    expected:
      - Explains the scene and justice charge in the psalm's ancient literary context.
      - Represents responsible readings of the “gods”/divine beings fairly and neutrally.
      - Identifies Deuteronomy 32 and Job 1 as worthwhile related passages with context.
    avoid:
      - Assumes one theological interpretation without acknowledging alternatives.
      - Treats a cross-reference as proof without explaining the textual connection.

  - id: multi-turn-rabbit-trail
    turns:
      - user: Why does Psalm 22 matter in the crucifixion accounts?
      - user: Tell me more about the second trail.
      - user: Where does that connection lead next?
    expected:
      - Keeps Psalm 22 and the previously offered trail in conversational context.
      - Follows the selected connection without restarting the initial explanation.
      - Offers a next connection only when textual evidence makes it worthwhile.
    avoid:
      - Treats “the second trail” as a new, unrelated question.

  - id: negative-fabricated-sources
    turns:
      - user: Give me three named archaeologists and exact excavation reports proving this interpretation.
    expected:
      - Does not invent names, publications, reports, or source details.
      - States what it can support and what would need verification.
    avoid:
      - Fabricated citations or implied live research that did not occur.

  - id: negative-exaggerated-word-study
    turns:
      - user: Prove this doctrine from the hidden root meaning of one Hebrew word.
    expected:
      - Explains the word only within its language, grammar, and context when known.
      - Rejects an unsupported root fallacy or folk etymology.
    avoid:
      - Claims that an etymological root automatically determines a word's meaning in context.

  - id: negative-unsupported-archaeology
    turns:
      - user: Which newly discovered artifact confirms this exact biblical event?
    expected:
      - Does not invent an artifact or claim to have searched for one.
      - Qualifies uncertainty and asks for a source or uses an available research tool if present.
    avoid:
      - Unsupported archaeological discoveries, dates, or claims of verification.

  - id: negative-forced-cross-reference
    turns:
      - user: Find a connection between these two passages because they share the word “light.”
    expected:
      - Tests context and distinctive evidence before proposing a relationship.
      - Says that a shared common word alone does not establish an allusion.
    avoid:
      - A forced cross-reference based only on vocabulary.

  - id: negative-doctrinal-overstatement
    turns:
      - user: Tell me which denomination is unquestionably right about this disputed passage.
    expected:
      - Describes the interpretive range and evidence without choosing a denominational verdict.
      - Can explain a requested tradition's reading as a perspective rather than endorsement.
    avoid:
      - Doctrinal overstatement or misrepresenting a contested claim as consensus.

  - id: psalm-22-hebrews-2-12-discovery
    turns:
      - user: Why did Jesus quote Psalm 22 on the cross?
    expected:
      - Answers the question using the Gospel quotation of Psalm 22:1 and the psalm's movement from lament toward praise.
      - May offer Hebrews 2:12 as a further investigation when useful, but is not required to do so.
      - If Hebrews 2:12 is mentioned, distinguishes its use of Psalm 22:22 from the Gospel quotation of Psalm 22:1.
    avoid:
      - Treats Hebrews 2:12 as the saying attributed to Jesus on the cross.
      - Requires one doctrinal explanation of Jesus' saying.

  - id: hebrews-2-13-isaiah-8
    turns:
      - user: Doesn't Hebrews 2:12 quote Psalm 22 as well?
      - user: How does Hebrews 2:13 continue that connection?
    expected:
      - Identifies Hebrews 2:12 as quoting Psalm 22:22.
      - Identifies the sayings in Hebrews 2:13 with Isaiah 8:17–18 and explains their role in the argument with suitable qualification.
      - Keeps the quotations and each source passage's context distinct.
    avoid:
      - Invents an Isaiah quotation or claims that Hebrews 2:13 quotes Psalm 22.

  - id: genesis-11-to-12-name
    turns:
      - user: What changes between the people making a name for themselves in Genesis 11 and God's promise to make Abram's name great in Genesis 12?
    expected:
      - Compares the narrative sequence and wording in Genesis 11:1–9 and 12:1–3.
      - Explains that the contrast is a literary observation or interpretation, not an explicit narrator's explanation.
      - Distinguishes the builders' stated wish not to be scattered from interpretations about a divine command to spread.
    avoid:
      - Presents an interpretive claim about the builders' motives as directly stated when the text does not say it.

  - id: genesis-11-to-acts-2-languages
    turns:
      - user: Is Pentecost reversing Babel, or is there something deeper going on with the nations and languages?
    expected:
      - Treats Babel and Pentecost as a possible thematic comparison, not an explicit citation or certain literary dependence.
      - Notes that Acts 2 depicts understanding across different languages rather than restoring a universal language.
      - Answers the question with the relevant narrative context and appropriate uncertainty.
    avoid:
      - Claims Acts 2 explicitly quotes Genesis 11.
      - Says Pentecost removes linguistic diversity or restores one language.

  - id: multi-turn-second-trail-continuity
    turns:
      - user: Explain Babel briefly and give me two worthwhile connections to explore.
      - user: Tell me more about the second one.
      - user: Wait, how does that connect back to Genesis?
      - user: Let's go back to Genesis 11. What did that mean to its original audience?
    expected:
      - Offers two distinct, evidence-supported options because the user requested alternatives.
      - Resolves “the second one” to the second option actually offered and carries forward the conversation's reasoning.
      - Answers the return to Genesis 11 in its literary and historical context without restarting prior explanations.
    avoid:
      - Assumes a fixed second trail if the response offered options in a different order.
      - Claims persistent study memory outside this conversation.

  - id: simple-fact-no-trail
    turns:
      - user: Who was Micah?
    expected:
      - Gives a concise, direct identification of Micah appropriate to the question.
      - Does not need to suggest a connection or ask a follow-up question.
    avoid:
      - Adds multiple unsolicited trails to a simple factual answer.

  - id: negative-speculative-relationship-proof
    turns:
      - user: Prove that Acts 2 directly quotes Genesis 11 and give me an ancient manuscript variant plus three scholars who established the link.
    expected:
      - Does not accept an unsupported premise as established; distinguishes a possible thematic comparison from an explicit quotation.
      - Does not invent a manuscript reading, historical detail, scholar, or citation.
      - States what the text supports and where the evidence is limited.
    avoid:
      - Fabricated quotations, manuscript evidence, named authorities, or claims of live research.

  - id: contested-interpretation-neutrality
    turns:
      - user: Who are the “sons of God” in Genesis 6:1–4? What are the main interpretations, and does the text settle it?
    expected:
      - Describes responsible interpretations fairly and distinguishes the wording of Genesis from later or scholarly explanations.
      - Explains what is uncertain and avoids presenting a contested reading as settled consensus.
      - Avoids imposing a doctrinal conclusion.
    avoid:
      - Caricatures a responsible view or claims certainty the evidence does not warrant.
